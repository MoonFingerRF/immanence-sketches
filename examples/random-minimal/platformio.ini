; immanence-sketches: random pieces from immanencepure.xyz, printed on the serial monitor.
; Set WIFI_SSID / WIFI_PASSWORD in random-minimal.ino first.
;   pio run -e esp32-s3-devkitc-1-n8r8 -t upload && pio device monitor
; Any ESP32 works: an S3 with PSRAM runs every piece; esp32dev (no PSRAM) gets 2D pieces that fit 64 KB.

[platformio]
src_dir = .

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
build_src_filter = +<*.ino> +<*.cpp>
lib_deps = symlink://../..
monitor_speed = 115200

[env:esp32-s3-devkitc-1-n8r8]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32dev]
board = esp32dev
; Wi-Fi + HTTPS + the VM is ~1.35 MB: more than the default 1.3 MB app partition of a 4 MB board
board_build.partitions = huge_app.csv
