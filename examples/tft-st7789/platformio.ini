; immanence-sketches on an SPI ST7789 colour TFT, ESP32-S3 with PSRAM.
; Builds tft-st7789.ino in this folder (the same file the Arduino IDE opens).
;   pio run              build
;   pio run -t upload    build and flash
;   pio device monitor   serial output (frame checks, faults)

[platformio]
src_dir = .

[env:esp32-s3-devkitc-1-n8r8]
; pioarduino: Arduino-ESP32 3.3 (ESP-IDF 5.5), the core these examples are tested with.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
; N8R8 module: 8 MB quad flash, 8 MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<*.ino> +<*.cpp> +<*.h>
lib_deps =
  ; this repository (the library): two levels up
  symlink://../..
  adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
  adafruit/Adafruit GFX Library@^1.12.1
monitor_speed = 115200
