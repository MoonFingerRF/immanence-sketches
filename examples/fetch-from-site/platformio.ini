; immanence-sketches: fetch pieces from immanencepure.xyz over HTTPS and run them on an ST7789
; (the panel and wiring of examples/tft-st7789), ESP32-S3 with PSRAM.
; First: cp secrets.example.h secrets.h, then fill in your Wi-Fi.
;   pio run              build
;   pio run -t upload    build and flash
;   pio device monitor   serial output

[platformio]
src_dir = .

[env:esp32-s3-devkitc-1-n8r8]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<*.ino> +<*.cpp> +<*.h>
lib_deps =
  ; this repository (the library): two levels up
  symlink://../..
  bblanchon/ArduinoJson@^7.4.2
  adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
  adafruit/Adafruit GFX Library@^1.12.1
monitor_speed = 115200
