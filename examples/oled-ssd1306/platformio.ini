; immanence-sketches on a 128x64 I2C SSD1306 OLED, any ESP32 (no PSRAM needed).
; Builds oled-ssd1306.ino in this folder (the same file the Arduino IDE opens).
;   pio run              build
;   pio run -t upload    build and flash
;   pio device monitor   serial output (frame checks, faults, memory)

[platformio]
src_dir = .

[env:esp32dev]
; pioarduino: Arduino-ESP32 3.3 (ESP-IDF 5.5), the core these examples are tested with.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino
build_src_filter = +<*.ino> +<*.cpp> +<*.h>
lib_deps =
  ; this repository (the library): two levels up
  symlink://../..
  adafruit/Adafruit SSD1306@^2.5.13
  adafruit/Adafruit GFX Library@^1.12.1
monitor_speed = 115200
